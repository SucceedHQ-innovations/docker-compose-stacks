version: '3.8'
services:
  mongodb:
    image: mongo:7
    volumes: ['mongo_data:/data/db']
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongodb:27017/app
      JWT_SECRET: \
    depends_on: [mongodb]
  frontend:
    build: ./frontend
    ports: ['3000:80']
    depends_on: [backend]
volumes:
  mongo_data:
version: '3.8'
services:
  web:
    image: httpd:2.4
    ports: ['80:80']
    volumes: ['./www:/usr/local/apache2/htdocs']
  php:
    image: php:8.2-fpm
    volumes: ['./www:/var/www/html']
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: \
      MYSQL_DATABASE: app_db
    volumes: ['mysql_data:/var/lib/mysql']
volumes:
  mysql_data: